<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日點名</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
        font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
        background:
            radial-gradient(circle at 15% 20%, rgba(255,255,255,.8) 0 2px, transparent 3px),
            linear-gradient(135deg, #eee9df, #dfe4dc);
        color: #3f4039;
    }

    .container {
        width: min(92vw, 520px);
        padding: 38px 32px 32px;
        background: rgba(250, 249, 245, .94);
        border: 1px solid rgba(80,80,70,.12);
        border-radius: 24px;
        box-shadow: 0 18px 45px rgba(60,60,50,.14);
        text-align: center;
        position: relative;
        overflow: hidden;
        animation: cardIn .7s ease-out;
    }

    .container::before {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: rgba(145, 157, 132, .12);
        top: -90px;
        right: -70px;
    }

    .eyebrow {
        font-size: 13px;
        letter-spacing: 4px;
        color: #8b907e;
        margin-bottom: 8px;
    }

    h1 {
        margin: 0;
        font-size: 34px;
        font-weight: 500;
        letter-spacing: 5px;
    }

    .subtitle {
        margin: 10px 0 24px;
        color: #8b8b82;
        font-size: 14px;
        letter-spacing: 1px;
    }

    textarea {
        width: 100%;
        height: 145px;
        padding: 16px;
        border: 1px solid #d5d5ca;
        border-radius: 15px;
        font-size: 16px;
        line-height: 1.8;
        font-family: inherit;
        background: rgba(255,255,255,.7);
        color: #4a4b44;
        resize: vertical;
    }

    textarea:focus {
        outline: none;
        border-color: #9aa28d;
        box-shadow: 0 0 0 4px rgba(154,162,141,.12);
    }

    .result {
        margin: 24px 0 14px;
        min-height: 125px;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px;
        border-radius: 18px;
        background: #e9ede4;
        border: 1px solid #d7ddd0;
        font-size: 38px;
        font-weight: 500;
        color: #596250;
        letter-spacing: 4px;
        transition: transform .25s ease, box-shadow .25s ease;
    }

    .result.drawing {
        animation: pulse .16s infinite alternate;
    }

    .result.selected {
        animation: reveal .65s cubic-bezier(.2,.8,.2,1);
        box-shadow: 0 8px 25px rgba(90,100,80,.14);
    }

    button {
        border: none;
        border-radius: 12px;
        padding: 13px 25px;
        margin: 5px;
        font-size: 15px;
        font-family: inherit;
        letter-spacing: 1px;
        cursor: pointer;
        transition: transform .2s ease, opacity .2s ease;
    }

    button:hover {
        transform: translateY(-2px);
        opacity: .9;
    }

    button:active {
        transform: translateY(0);
    }

    .draw {
        background: #707a67;
        color: white;
    }

    .reset {
        background: #d8d6cc;
        color: #5d5d56;
    }

    .status {
        margin-top: 16px;
        color: #96968d;
        font-size: 13px;
        letter-spacing: 1px;
    }

    .line {
        width: 45px;
        height: 1px;
        background: #aab09f;
        margin: 20px auto 0;
    }

    @keyframes cardIn {
        from {
            opacity: 0;
            transform: translateY(18px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes pulse {
        from {
            transform: scale(1);
        }
        to {
            transform: scale(1.035);
        }
    }

    @keyframes reveal {
        0% {
            transform: scale(.82) rotate(-2deg);
            opacity: .2;
        }
        55% {
            transform: scale(1.08) rotate(1deg);
            opacity: 1;
        }
        100% {
            transform: scale(1) rotate(0);
        }
    }
</style>
</head>

<body>

<div class="container">
    <div class="eyebrow">RANDOM PICK</div>
    <h1>今日點名</h1>
    <div class="subtitle">讓每一次相遇，都有一點未知</div>

    <textarea id="nameInput" placeholder="請輸入名字&#10;一行一個名字"></textarea>

    <div class="result" id="result">準備好了</div>

    <button class="draw" onclick="drawName()">開始點名</button>
    <button class="reset" onclick="resetDraw()">重新開始</button>

    <div class="status" id="status">尚未抽取任何人</div>
    <div class="line"></div>
</div>

<script>
    let usedNames = [];
    let drawingTimer = null;

    function drawName() {
        const input = document.getElementById("nameInput").value;

        const allNames = input
            .split("\n")
            .map(name => name.trim())
            .filter(name => name !== "");

        const result = document.getElementById("result");
        const status = document.getElementById("status");

        if (allNames.length === 0) {
            result.textContent = "請先輸入名字";
            return;
        }

        const availableNames = allNames.filter(
            name => !usedNames.includes(name)
        );

        if (availableNames.length === 0) {
            result.textContent = "全部抽完了";
            status.textContent = `這一輪共抽出 ${usedNames.length} 人`;
            return;
        }

        // 如果正在抽，就不要重複啟動
        if (drawingTimer) return;

        result.classList.remove("selected");
        result.classList.add("drawing");

        let count = 0;

        // 抽籤動畫：快速輪播名字
        drawingTimer = setInterval(() => {
            const randomIndex = Math.floor(
                Math.random() * availableNames.length
            );

            result.textContent = availableNames[randomIndex];
            count++;

            if (count >= 16) {
                clearInterval(drawingTimer);
                drawingTimer = null;

                const finalIndex = Math.floor(
                    Math.random() * availableNames.length
                );
                const selectedName = availableNames[finalIndex];

                usedNames.push(selectedName);

                result.textContent = selectedName;
                result.classList.remove("drawing");

                // 重新觸發揭曉動畫
                void result.offsetWidth;
                result.classList.add("selected");

                status.textContent =
                    `已抽出 ${usedNames.length} 人 · 剩下 ${availableNames.length - 1} 人`;
            }
        }, 90);
    }

    function resetDraw() {
        if (drawingTimer) {
            clearInterval(drawingTimer);
            drawingTimer = null;
        }

        usedNames = [];

        const result = document.getElementById("result");
        result.classList.remove("drawing", "selected");
        result.textContent = "準備好了";

        document.getElementById("status").textContent =
            "尚未抽取任何人";
    }
</script>

</body>
</html>
